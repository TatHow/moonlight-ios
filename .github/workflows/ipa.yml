name: Build unsigned IPA

on:
  push:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label (xcode-27 has the iOS 27 SDK and the iPhone Duo simulator)"
        default: xcode-27
        required: true

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUNDLE_ID: com.tathow.moonlightfold

jobs:
  ipa:
    name: Build IPA
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Ensure iOS platform is installed
        run: |
          if ! xcodebuild -showsdks | grep -q iphoneos; then
            xcodebuild -downloadPlatform iOS
          fi

      # Print the foldable (iPhone Duo) API surface from the SDK headers, so the
      # fold-posture code can be written against the real names.
      - name: Probe foldable APIs in SDK
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          H="$SDK/System/Library/Frameworks/UIKit.framework/Headers"
          files=$(grep -rlE "UIHinge|ReservedRegion|UIArrangement" "$H" | xargs -n1 basename | tr '\n' ' ')
          echo "::notice title=Fold API headers::$files"
          rr=$(grep -n -B2 -A4 -i "reservedRegion" "$H/UIView.h" | grep -v "^\s*$" | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=UIView reservedRegions::$rr"
          for f in $(grep -rlE "UIHinge|ReservedRegion" "$H" | grep -v "/UIView.h"); do
            body=$(grep -vE "^\s*$|^//|^\s*\*|^/\*" "$f" | grep -E "UIHinge|ReservedRegion|reservedRegion|API_AVAILABLE|typedef|@property|^- |^\+ |NS_ENUM|NS_OPTIONS|case|^\s+UI" | head -n 120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$(basename "$f")::$body"
          done

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Moonlight.app

      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$( (grep -E "error:|\*\* BUILD" build.log || tail -n 40 build.log) | tail -n 60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::${msg}"
          fi

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Moonlight.app out/Payload/
          cd out
          SHORT_SHA=$(git rev-parse --short HEAD)
          zip -qry "../Moonlight-Fold-${SHORT_SHA}-unsigned.ipa" Payload
          cd ..
          ls -lh *.ipa
          APP=build/Build/Products/Release-iphoneos/Moonlight.app
          info=$(printf "IPA %s | binary %s bytes | bundle %s | min iOS %s | SDK %s | Xcode %s" \
            "$(ls *.ipa)" "$(stat -f %z "$APP/Moonlight")" \
            "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" \
            "$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$APP/Info.plist")" \
            "$(/usr/libexec/PlistBuddy -c 'Print DTSDKName' "$APP/Info.plist")" \
            "$(/usr/libexec/PlistBuddy -c 'Print DTXcode' "$APP/Info.plist")")
          echo "::notice title=Build summary::$info"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Fold-unsigned-ipa
          path: "*.ipa"
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      # Rolling pre-release so the latest IPA has a direct download link
      - name: Publish pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/fold'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=fold-latest
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" *.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Moonlight Fold (latest build)" \
            --notes "Automatic unsigned build of the fold branch at ${GITHUB_SHA::7}. Sideload the .ipa with Sideloadly."
